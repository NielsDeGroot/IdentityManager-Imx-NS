<!-- NS20260710 Simplified memberships -->
<div class="imx-tab-content">
  <div class="imx-mat-tab-content-body">
    <div eui-sidesheet-content class="imx-tab-content-body">
      <ng-container *ngIf="canHavePrimaryMemberships() && showPrimaryMemberships(); else secondaryOnly">
        <mat-tab-group *ngIf="showSecondaryMemberships(); else primaryOnly">
          <mat-tab [label]="'#LDS#Memberships' | translate">
            <imx-secondary-memberships></imx-secondary-memberships>
          </mat-tab>
          <mat-tab [label]="'#LDS#Primary memberships' | translate">
            <imx-primary-memberships></imx-primary-memberships>
          </mat-tab>
        </mat-tab-group>
      </ng-container>
    </div>
  </div>
</div>

<ng-template #secondaryOnly>
  <imx-secondary-memberships [isAdmin]="isAdmin" [entity]="entity" [ownershipInfo]="ownershipInfo"></imx-secondary-memberships>
</ng-template>

<ng-template #primaryOnly>
  <imx-primary-memberships [isAdmin]="isAdmin" [entity]="entity" [ownershipInfo]="ownershipInfo"></imx-primary-memberships>
</ng-template>
